# https://taskfile.dev
version: "3"

tasks:
  up:
    desc: Start Lupin locally (Telegram long polling)
    dir: ..
    cmds: [docker compose up --build]
  up:tunnel:
    desc: Start with a cloudflared quick tunnel (set TELEGRAM_MODE=webhook in .env)
    dir: ..
    cmds: [docker compose --profile tunnel up --build]
  down:
    dir: ..
    cmds: [docker compose --profile tunnel down]
  logs:
    dir: ..
    cmds: [docker compose logs -f api]
  psql:
    desc: Open a psql shell on the local database
    dir: ..
    cmds: [docker compose exec db psql -U lupin]
  test:
    cmds: [uv run pytest]
  lint:
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
  migration:
    desc: "Generate a migration from model changes (needs the db running): task migration -- 'message'"
    cmds: [uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"]
